[package]
name = "pdf-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
dashmap = "6.2.1"
futures-util = "0.3.34"
handlebars = "6.4.4"
md5 = "0.8.1"
once_cell = "1.21.4"
opendal = { version = "0.59.4", features = [
    "layers-tracing",
    "services-s3",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
tokio = { version = "1.53.2", features = ["full"] }
dotenvy = "0.15.7"
minijinja = { version = "3.0", features = ["serde"] }
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
uuid = "1.28.0"
moka = { version = "0.12", features = ["future"] }
lopdf = "0.45.0"
reqwest = { version = "0.13", features = ["json", "multipart"] }
lru = "0.18.5"
tracing-subscriber = "0.3.23"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
