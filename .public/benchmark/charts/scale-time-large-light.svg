<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">10,000 large invoices (300 lines, 7-9 pages): time to finish</title><desc id="d">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</desc><rect x="0.5" y="0.5" width="879" height="435" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">10,000 large invoices (300 lines, 7-9 pages): time to finish</text><text x="24" y="56" font-size="13" fill="#656d76">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF (NATIVE / SERVER)</text><text x="24" y="115.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="102" width="4.1" height="18" rx="4" fill="#1a7f37"/><text x="240.1" y="115.5" font-size="14" fill="#1f2328" font-weight="700">33 s <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="132" width="10.4" height="18" rx="4" fill="#8c959f"/><text x="246.4" y="145.5" font-size="14" fill="#1f2328" font-weight="500">1.4 min</text><text x="24" y="175.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="162" width="22.2" height="18" rx="4" fill="#8c959f"/><text x="258.2" y="175.5" font-size="14" fill="#1f2328" font-weight="500">3.0 min <tspan fill="#656d76" font-weight="400" font-size="12">projected from 8,422</tspan></text><text x="24" y="205.5" font-size="14" fill="#1f2328" font-weight="400">wkhtmltopdf</text><rect x="228" y="192" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="192" width="78.6" height="18" rx="4" fill="#8c959f"/><text x="314.6" y="205.5" font-size="14" fill="#1f2328" font-weight="500">10.5 min <tspan fill="#656d76" font-weight="400" font-size="12">x86 under Rosetta, projected from 2,384</tspan></text><text x="24" y="235.5" font-size="14" fill="#1f2328" font-weight="400">html-pdf</text><rect x="228" y="222" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="222" width="168.2" height="18" rx="4" fill="#8c959f"/><text x="404.2" y="235.5" font-size="14" fill="#1f2328" font-weight="500">22.4 min <tspan fill="#656d76" font-weight="400" font-size="12">PhantomJS, x86 under Rosetta, projected from 1,117</tspan></text><text x="24" y="266" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF IN THE BROWSER</text><text x="24" y="303.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="290" width="16.4" height="18" rx="4" fill="#818cf8"/><text x="252.4" y="303.5" font-size="14" fill="#1f2328" font-weight="700">2.2 min</text><text x="24" y="333.5" font-size="14" fill="#1f2328" font-weight="400">html2pdf.js</text><rect x="228" y="320" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="320" width="331.5" height="18" rx="4" fill="#8c959f"/><text x="567.5" y="333.5" font-size="14" fill="#1f2328" font-weight="500">44.2 min <tspan fill="#656d76" font-weight="400" font-size="12">projected from 566</tspan></text><text x="24" y="363.5" font-size="14" fill="#1f2328" font-weight="400">jspdf-html2canvas</text><rect x="228" y="350" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="350" width="360.0" height="18" rx="4" fill="#8c959f"/><text x="596.0" y="363.5" font-s