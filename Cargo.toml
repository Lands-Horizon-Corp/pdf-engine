[package]
name = "pdf-engine"
version = "1.1.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
md5 = "0.8.1"
opendal = { version = "0.59.4", features = [
    "services-s3",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.2", features = ["full"] }
dotenvy = "0.15.7"
minijinja = { version = "3.0", features = ["serde", "fuel"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
moka = { version = "0.12", features = ["future"] }
lopdf = "0.46"
reqwest = { version = "0.13", features = ["json", "multipart"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1"
mimalloc = "0.1"
base64 = "0.23"
notify = "8"
fulgur = "0.40.0"
bytes = "1.12.1"
libc = "0.2"
actix-web = "4.18.1"
actix-multipart = "0.8.5"
simd-json = "0.18.1"
actix-cors = "0.7.2"
hayro = "0.8.0"

[target.'cfg(windows)'.dependencies]
# IPC mode takes over the real stdout handle (src/ipc.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
axum = { version = "0.8.9", features = ["multipart"] }

# Patched fulgur: shares the system font context and font data across renders. See
# vendor/fulgur/PATCHES.md.
[patch.crates-io]
fulgur = { path = "vendor/fulgur" }
# Patched stylo: no global lock around user-agent style data. See vendor/stylo/PATCHES.md.
stylo = { path = "vendor/stylo" }
# Patched fontique: per-clone font handles, no shared refcount. See vendor/fontique/PATCHES.md.
fontique = { path = "vendor/fontique" }
# Patched taffy: percentage-width tables inside padded blocks. See vendor/taffy/PATCHES.md.
taffy = { path = "vendor/taffy" }
# Patched krilla: adjustable zlib level. See vendor/krilla/PATCHES.md.
krilla = { path = "vendor/krilla" }
# Patched blitz-dom: one user-agent stylesheet parse per thread. See vendor/blitz-dom/PATCHES.md.
blitz-dom = { path = "vendor/blitz-dom" }

# Dependencies (Fulgur pulls in Servo's style engine) without debug info: much less linker
# memory and faster test builds. Our own crate keeps full debug info.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Fulgur renders in-process: unwinding lets a renderer panic fail one request
# instead of aborting the whole server.
panic = 'unwind'
strip = true
