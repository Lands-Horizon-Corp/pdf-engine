<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">10,000 receipts (1 page): time to finish</title><desc id="d">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</desc><rect x="0.5" y="0.5" width="879" height="683" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">10,000 receipts (1 page): time to finish</text><text x="24" y="56" font-size="13" fill="#656d76">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF (NATIVE)</text><text x="24" y="115.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="102" width="3.0" height="18" rx="4" fill="#1a7f37"/><text x="239.0" y="115.5" font-size="14" fill="#1f2328" font-weight="700">2.0 s <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="132" width="6.2" height="18" rx="4" fill="#8c959f"/><text x="242.2" y="145.5" font-size="14" fill="#1f2328" font-weight="500">14 s</text><text x="24" y="175.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="162" width="34.3" height="18" rx="4" fill="#8c959f"/><text x="270.3" y="175.5" font-size="14" fill="#1f2328" font-weight="500">1.3 min</text><text x="24" y="206" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF IN