<html><head><style>body { font-family: sans-serif; padding: 24px; } .box { width: 120px; height: 60px; color: #fff; font-size: 11px; padding: 4px; }</style></head><body>
<h2>Positioning</h2>
<div style="position:relative; height:220px; border:1px dashed #999">
<div class="box" style="position:absolute; top:10px; left:10px; background:#ef4444">abs top-left</div>
<div class="box" style="position:absolute; bottom:10px; right:10px; background:#3b82f6">abs bottom-right</div>
<div class="box" style="position:absolute; top:60px; left:90px; background:#22c55e; z-index:2">z-index 2 (on top)</div>
<div class="box" style="position:absolute; top:80px; left:140px; background:#a855f7; z-index:1">z-index 1</div>
<div class="box" style="position:relative; left:300px; top:20px; background:#f59e0b">relative offset</div></div>
<div style="position:relative; margin-top:20px; height:80px; border:1px solid #ccc"><div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#111; color:#fff; padding:6px">centered via transform</div></div>
<div style="position:relative; height:90px; margin-top:20px; border:2px solid #dc2626"><div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; color:rgba(220,38,38,.25); font-weight:900; transform:rotate(-12deg)">DRAFT</div></div>
</body></html>
