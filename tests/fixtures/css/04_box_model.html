<html><head><style>
body { font-family: sans-serif; padding: 24px; }
.b { display: inline-block; width: 140px; height: 60px; margin: 8px; padding: 8px; font-size: 11px; vertical-align: top; }
</style></head><body><h2>Box model, borders, radius, shadow</h2>
<div class="b" style="border:1px solid #000">solid 1px</div>
<div class="b" style="border:3px dashed #2563eb">dashed 3px</div>
<div class="b" style="border:3px dotted #dc2626">dotted 3px</div>
<div class="b" style="border:6px double #16a34a">double 6px</div>
<div class="b" style="border:2px solid #000; border-radius:12px">radius 12</div>
<div class="b" style="border:2px solid #7c3aed; border-radius:50%">radius 50%</div>
<div class="b" style="box-shadow:0 4px 12px rgba(0,0,0,.35)">box-shadow</div>
<div class="b" style="border-left:6px solid #f59e0b; background:#fffbeb">left accent</div>
<div class="b" style="outline:2px solid #e11d48; outline-offset:4px">outline</div>
<div style="width:300px; padding:20px; margin:20px 0; border:1px solid #999; box-sizing:border-box; background:#eef">box-sizing: border-box 300px</div>
</body></html>
