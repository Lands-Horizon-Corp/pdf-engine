<html><head><style>
body { font-family: sans-serif; padding: 24px; }
.g > div { background: #10b981; color: #fff; padding: 10px; font-size: 12px; }
</style></head><body><h2>CSS Grid</h2>
<div class="g" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>
<div class="g" style="display:grid; grid-template-columns:120px 1fr 2fr; gap:8px; margin-bottom:16px"><div>120px</div><div>1fr</div><div>2fr</div></div>
<div class="g" style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:16px"><div style="grid-column:span 2">span 2</div><div>c</div><div>d</div><div style="grid-column:1/-1">full row</div></div>
<div class="g" style="display:grid; grid-template-areas:'h h' 's m' 'f f'; grid-template-columns:120px 1fr; gap:6px">
<div style="grid-area:h">header</div><div style="grid-area:s; background:#047857">sidebar</div><div style="grid-area:m; height:80px">main</div><div style="grid-area:f; background:#065f46">footer</div></div>
</body></html>
