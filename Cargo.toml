[package]
name = "pdf-engine"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
dashmap = "6.2.1"
futures-util = "0.3.34"
handlebars = "6.4.4"
md5 = "0.8.1"
once_cell = "1.21.4"
opendal = { version = "0.59.4", features = [
    "layers-tracing",
    "services-s3",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
tokio = { version = "1.53.2", features = ["full"] }
dotenvy = "0.15.7"
minijinja = { version = "3.0", features = ["serde"] }
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
uuid = { version = "1.28.0", features = ["v4"] }
moka = { version = "0.12", features = ["future"] }
lopdf = "0.45.0"
reqwest = { version = "0.13", features = ["json", "multipart"] }
lru = "0.18.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1"
mimalloc = "0.1"
base64 = "0.23"
notify = "8"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
fulgur = "0.40.0"
bytes = "1.12.1"
libc = "0.2"
tower-http = { version = "0.7.1", features = [
    "compression-gzip",
    "compression-br",
    "compression-zstd",
] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8.2", features = ["async_tokio"] }
flate2 = "1"

[[bench]]
name = "render"
harness = false

# Patched fulgur: shares the system font context across renders (4-6x faster). See
# vendor/fulgur/PATCHES.md.
[patch.crates-io]
fulgur = { path = "vendor/fulgur" }

# Dependencies (Fulgur pulls in Servo's style engine) without debug info: much less linker
# memory and faster test builds. Our own crate keeps full debug info.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Fulgur renders in-process: unwinding lets a renderer panic fail one request
# instead of aborting the whole server.
panic = 'unwind'
strip = true
