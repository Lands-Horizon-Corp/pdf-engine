df-html2canvas</text><rect x="228" y="380" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="380" width="199.6" height="18" rx="4" fill="#6e7681"/><text x="435.6" y="393.5" font-size="14" fill="#e6edf3" font-weight="500">11.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 2,173</tspan></text><text x="24" y="423.5" font-size="14" fill="#e6edf3" font-weight="400">html2pdf.js</text><rect x="228" y="410" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="410" width="241.4" height="18" rx="4" fill="#6e7681"/><text x="477.4" y="423.5" font-size="14" fill="#e6edf3" font-weight="500">13.9 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 1,798</tspan></text><rect x="24" y="450" width="10" height="10" rx="2" fill="#3fb950"/><text x="40" y="459" font-size="12" fill="#8b949e">fastest</text><rect x="104.19999999999999" y="450" width="10" height="10" rx="2" fill="#7c83f5"/><text x="120.19999999999999" y="459" font-size="12" fill="#8b949e">pdf-engine</text><rect x="204.2" y="450" width="10" height="10" rx="2" fill="#6e7681"/><text x="220.2" y="459" font-size="12" fill="#8b949e">other libraries</text><text x="24" y="482" font-size="11" fill="#8b949e">Apple M4, darwin arm64, measured 2026-10-25. Reproduce: .public/benchmark/README.md</text></svg>
