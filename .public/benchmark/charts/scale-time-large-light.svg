<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">10,000 large invoices (300 lines, 7-9 pages): time to finish</title><desc id="d">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</desc><rect x="0.5" y="0.5" width="879" height="683" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">10,000 large invoices (300 lines, 7-9 pages): time to finish</text><text x="24" y="56" font-size="13" fill="#656d76">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF (NATIVE)</text><text x="24" y="115.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="102" width="4.1" height="18" rx="4" fill="#1a7f37"/><text x="240.1" y="115.5" font-size="14" fill="#1f2328" font-weight="700">33 s <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="132" width="10.4" height="18" rx="4" fill="#8c959f"/><text x="246.4" y="145.5" font-size="14" fill="#1f2328" font-weight="500">1.4 min</text><text x="24" y="175.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="162" width="22.5" height="18" rx="4" fill="#8c959f"/><text x="258.5" y="175.5" font-size="14" fill="#1f2328" font-weight="500">3.0 min <tspan fill="#656d76" font-weight="400" font-size="12">projected from 8,348</tspan></text><text x="24" y="206" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF IN THE BROWSER</text><text x="24" y="243.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="230" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="230" width="16.3" height="18" rx="4" fill="#818cf8"/><text x="252.3" y="243.5" font-size="14" fill="#1f2328" font-weight="700">2.2 min</text><text x="24" y="273.5" font-size="14" fill="#1f2328" font-weight="400">html2pdf.js</text><rect x="228" y="260" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="260" width="330.5" height="18" rx="4" fill="#8c959f"/><text x="566.5" y="273.5" font-size="14" fill="#1f2328" font-weight="500">44.1 min <tspan fill="#656d76" font-weight="400" font-size="12">projected from 568</tspan></text><text x="24" y="303.5" font-size="14" fill="#1f2328" font-weight="400">jspdf-html2canvas</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="290" width="360.0" height="18" rx="4" fill="#8c959f"/><text x="596.0" y="303.5" font-size="14" fill="#1f2328" font-weight="500">48.0 min <tspan fill="#656d76" font-weight="400" font-size="12">projected from 521</tspan></text><text x="24" y="334" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">PDF DRAWN IN CODE (DOES NOT READ HTML)</text><text x="24" y="371.5" font-size="14" fill="#1f2328" font-weight="400">jsPDF</text><rect x="228" y="358" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="358" width="8.8" height="18" rx="4" fill="#8c959f"/><text x="244.8" y="371.5" font-size="14" fill="#1f2328" font-weight="500">1.2 min <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="401.5" font-size="14" fill="#1f2328" font-weight="400">pdfkit</text><rect x="228" y="388" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="388" width="9.0" height="18" rx="4" fill="#8c959f"/><text x="245.0" y="401.5" font-size="14" fill="#1f2328" font-weight="500">1.2 min <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="431.5" font-size="14" fill="#1f2328" font-weight="400">pdf-lib</text><rect x="228" y="418" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="418" width="13.8" height="18" rx="4" fill="#8c959f"/><text x="249.8" y="431.5" font-size="14" fill="#1f2328" font-weight="500">1.8 min <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="461.5" font-size="14" fill="#1f2328" font-weight="400">pdfmake</text><rect x="228" y="448" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="448" width="27.9" height="18" rx="4" fill="#8c959f"/><text x="263.9" y="461.5" font-size="14" fill="#1f2328" font-weight="500">3.7 min <tspan fill="#656d76" font-weight="400" font-size="12">Latin only, projected from 6,723</tspan></text><text x="24" y="491.5" font-size="14" fill="#1f2328" font-weight="400">jsPDF</text><rect x="228" y="478" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="478" width="29.1" height="18" rx="4" fill="#8c959f"/><text x="265.1" y="491.5" font-size="14" fill="#1f2328" font-weight="500">3.9 min <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font, projected from 6,443</tspan></text><text x="24" y="521.5" font-size="14" fill="#1f2328" font-weight="400">pdfkit</text><rect x="228" y="508" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="508" width="41.3" height="18" rx="4" fill="#8c959f"/><text x="277.3" y="521.5" font-size="14" fill="#1f2328" font-weight="500">5.5 min <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font, projected from 4,544</tspan></text><text x="24" y="551.5" font-size="14" fill="#1f2328" font-weight="400">pdfmake</text><rect x="228" y="538" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="538" width="56.5" height="18" rx="4" fill="#8c959f"/><text x="292.5" y="551.5" font-size="14" fill="#1f2328" font-weight="500">7.5 min <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font, projected from 3,318</tspan></text><text x="24" y="581.5" font-size="14" fill="#1f2328" font-weight="400">pdf-lib</text><rect x="228" y="568" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="568" width="104.9" height="18" rx="4" fill="#8c959f"/><text x="340.9" y="581.5" font-size="14" fill="#1f2328" font-weight="500">14.0 min <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font, projected from 1,788</tspan></text><text x="24" y="611.5" font-size="14" fill="#1f2328" font-weight="400">@react-pdf/renderer</text><rect x="228" y="598" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="598" width="204.5" height="18" rx="4" fill="#8c959f"/><text x="440.5" y="611.5" font-size="14" fill="#1f2328" font-weight="500">27.3 min <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font, projected from 917</tspan></text><rect x="24" y="638" width="10" height="10" rx="2" fill="#1a7f37"/><text x="40" y="647" font-size="12" fill="#656d76">fastest</text><rect x="104.19999999999999" y="638" width="10" height="10" rx="2" fill="#818cf8"/><text x="120.19999999999999" y="647" font-size="12" fill="#656d76">pdf-engine</text><rect x="204.2" y="638" width="10" height="10" rx="2" fill="#8c959f"/><text x="220.2" y="647" font-size="12" fill="#656d76">other libraries</text><text x="24" y="670" font-size="11" fill="#656d76">Apple M4, darwin arm64, measured 2026-10-25. Reproduce: .public/benchmark/README.md</text></svg>
