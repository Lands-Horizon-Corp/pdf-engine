<html><head><style>
body { font-family: sans-serif; padding: 24px; }
.f { display: flex; background: #f1f5f9; margin-bottom: 14px; padding: 6px; }
.f > div { background: #3b82f6; color: #fff; padding: 8px 12px; font-size: 12px; }
</style></head><body><h2>Flexbox</h2>
<div class="f" style="justify-content:space-between"><div>A</div><div>B</div><div>C</div></div>
<div class="f" style="justify-content:center; gap:10px"><div>center</div><div>gap 10</div></div>
<div class="f" style="justify-content:flex-end"><div>end</div></div>
<div class="f" style="align-items:center; height:70px"><div style="height:20px">short</div><div style="height:50px">tall</div></div>
<div class="f" style="flex-wrap:wrap; gap:6px; width:300px"><div>wrap1</div><div>wrap2</div><div>wrap3</div><div>wrap4</div><div>wrap5</div></div>
<div class="f"><div style="flex:1">flex:1</div><div style="flex:2; background:#1d4ed8">flex:2</div><div style="width:80px; background:#0f172a">80px</div></div>
<div class="f" style="flex-direction:column; width:150px"><div>col 1</div><div>col 2</div></div>
<div class="f" style="justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; background:none">
<div style="background:none; color:#000; font-size:24px; font-weight:bold">INVOICE</div><div style="background:none; color:#555">#2026-001</div></div>
</body></html>
