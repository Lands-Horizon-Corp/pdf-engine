<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">10,000 multi-table statements (5 tables, 4-6 pages): time to finish</title><desc id="d">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</desc><rect x="0.5" y="0.5" width="879" height="683" rx="10" fill="#0d1117" stroke="#30363d"/><text x="24" y="36" font-size="18" font-weight="700" fill="#e6edf3">10,000 multi-table statements (5 tables, 4-6 pages): time to finish</text><text x="24" y="56" font-size="13" fill="#8b949e">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF (NATIVE)</text><text x="24" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="102" width="3.3" height="18" rx="4" fill="#3fb950"/><text x="239.3" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">18 s <tspan fill="#3fb950" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="132" width="10.5" height="18" rx="4" fill="#6e7681"/><text x="246.5" y="145.5" font-size="14" fill="#e6edf3" font-weight="500">57 s</text><text x="24" y="175.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="162" width="26.2" height="18" rx="4" fill="#6e7681"/><text x="262.2" y="175.5" font-size="14" fill="#e6edf3" font-weight="500">2.4 min</text><text x="24" y="206" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF IN THE BROWSER</text><text x="24" y="243.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="230" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="230" width="14.6" height="18" rx="4" fill="#7c83f5"/><text x="250.6" y="243.5" font-size="14" fill="#e6edf3" font-weight="700">1.3 min</text><text x="24" y="273.5" font-size="14" fill="#e6edf3" font-weight="400">html2pdf.js</text><rect x="228" y="260" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="260" width="348.3" height="18" rx="4" fill="#6e7681"/><text x="584.3" y="273.5" font-size="14" fill="#e6edf3" font-weight="500">31.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 794</tspan></text><text x="24" y="303.5" font-size="14" fill="#e6edf3" font-weight="400">jspdf-html2canvas</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="290" width="360.0" height="18" rx="4" fill="#6e7681"/><text x="596.0" y="303.5" font-size="14" fill="#e6edf3" font-weight="500">32.6 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 768</tspan></text><text x="24" y="334" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">PDF DRAWN IN CODE (DOES NOT READ HTML)</text><text x="24" y="371.5" font-size="14" fill="#e6edf3" font-weight="400">jsPDF</text><rect x="228" y="358" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="358" width="8.0" height="18" rx="4" fill="#6e7681"/><text x="244.0" y="371.5" font-size="14" fill="#e6edf3" font-weight="500">43 s <tspan fill="#8b949e" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="401.5" font-size="14" fill="#e6edf3" font-weight="400">pdfkit</text><rect x="228" y="388" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="388" width="8.2" height="18" rx="4" fill="#6e7681"/><text x="244.2" y="401.5" font-size="14" fill="#e6edf3" font-weight="500">45 s <tspan fill="#8b949e" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="431.5" font-size="14" fill="#e6edf3" font-weight="400">pdf-lib</text><rect x="228" y="418" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="418" width="12.3" height="18" rx="4" fill="#6e7681"/><text x="248.3" y="431.5" font-size="14" fill="#e6edf3" font-weight="500">1.1 min <tspan fill="#8b949e" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="461.5" font-size="14" fill="#e6edf3" font-weight="400">pdfmake</text><rect x="228" y="448" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="448" width="25.4" height="18" rx="4" fill="#6e7681"/><text x="261.4" y="461.5" font-size="14" fill="#e6edf3" font-weight="500">2.3 min <tspan fill="#8b949e" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="491.5" font-size="14" fill="#e6edf3" font-weight="400">jsPDF</text><rect x="228" y="478" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="478" width="35.3" height="18" rx="4" fill="#6e7681"/><text x="271.3" y="491.5" font-size="14" fill="#e6edf3" font-weight="500">3.2 min <tspan fill="#8b949e" font-weight="400" font-size="12">Unicode font, projected from 7,825</tspan></text><text x="24" y="521.5" font-size="14" fill="#e6edf3" font-weight="400">pdfkit</text><rect x="228" y="508" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="508" width="50.7" height="18" rx="4" fill="#6e7681"/><text x="286.7" y="521.5" font-size="14" fill="#e6edf3" font-weight="500">4.6 min <tspan fill="#8b949e" font-weight="400" font-size="12">Unicode font, projected from 5,451</tspan></text><text x="24" y="551.5" font-size="14" fill="#e6edf3" font-weight="400">pdfmake</text><rect x="228" y="538" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="538" width="65.4" height="18" rx="4" fill="#6e7681"/><text x="301.4" y="551.5" font-size="14" fill="#e6edf3" font-weight="500">5.9 min <tspan fill="#8b949e" font-weight="400" font-size="12">Unicode font, projected from 4,228</tspan></text><text x="24" y="581.5" font-size="14" fill="#e6edf3" font-weight="400">pdf-lib</text><rect x="228" y="568" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="568" width="108.7" height="18" rx="4" fill="#6e7681"/><text x="344.7" y="581.5" font-size="14" fill="#e6edf3" font-weight="500">9.8 min <tspan fill="#8b949e" font-weight="400" font-size="12">Unicode font, projected from 2,541</tspan></text><text x="24" y="611.5" font-size="14" fill="#e6edf3" font-weight="400">@react-pdf/renderer</text><rect x="228" y="598" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="598" width="160.1" height="18" rx="4" fill="#6e7681"/><text x="396.1" y="611.5" font-size="14" fill="#e6edf3" font-weight="500">14.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">Unicode font, projected from 1,726</tspan></text><rect x="24" y="638" width="10" height="10" rx="2" fill="#3fb950"/><text x="40" y="647" font-size="12" fill="#8b949e">fastest</text><rect x="104.19999999999999" y="638" width="10" height="10" rx="2" fill="#7c83f5"/><text x="120.19999999999999" y="647" font-size="12" fill="#8b949e">pdf-engine</text><rect x="204.2" y="638" width="10" height="10" rx="2" fill="#6e7681"/><text x="220.2" y="647" font-size="12" fill="#8b949e">other libraries</text><text x="24" y="670" font-size="11" fill="#8b949e">Apple M4, darwin arm64, measured 2026-10-25. Reproduce: .public/benchmark/README.md</text></svg>
