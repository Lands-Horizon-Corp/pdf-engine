<svg xmlns="http://www.w3.org/2000/svg" width="880" height="556" viewBox="0 0 880 556" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">In Node: time to make one invoice PDF</title><desc id="d">Shorter is faster. 30-row invoice, warm median.</desc><rect x="0.5" y="0.5" width="879" height="555" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">In Node: time to make one invoice PDF</text><text x="24" y="56" font-size="13" fill="#656d76">Shorter is faster. 30-row invoice, warm median.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">HTML TO PDF</text><text x="24" y="115.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="102" width="17.4" height="18" rx="4" fill="#818cf8"/><text x="253.4" y="115.5" font-size="14" fill="#1f2328" font-weight="700">1.7 ms</text><text x="24" y="145.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="132" width="63.7" height="18" rx="4" fill="#8c959f"/><text x="299.7" y="145.5" font-size="14" fill="#1f2328" font-weight="500">6.0 ms</text><text x="24" y="175.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="162" width="360.0" height="18" rx="4" fill="#8c959f"/><text x="596.0" y="175.5" font-size="14" fill="#1f2328" font-weight="500">34 ms</text><text x="24" y="206" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">PDF DRAWN IN CODE (DOES NOT READ HTML)</text><text x="24" y="243.5" font-size="14" fill="#1f2328" font-weight="700">jsPDF (built-in font)</text><rect x="228" y="230" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="230" width="8.4" height="18" rx="4" fill="#1a7f37"/><text x="244.4" y="243.5" font-size="14" fill="#1f2328" font-weight="700">0.8 ms <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan> <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="273.5" font-size="14" fill="#1f2328" font-weight="400">pdf-lib (built-in font)</text><rect x="228" y="260" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="260" width="12.6" height="18" rx="4" fill="#8c959f"/><text x="248.6" y="273.5" font-size="14" fill="#1f2328" font-weight="500">1.2 ms <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="303.5" font-size="14" fill="#1f2328" font-weight="400">pdfkit (built-in font)</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="290" width="14.6" height="18" rx="4" fill="#8c959f"/><text x="250.6" y="303.5" font-size="14" fill="#1f2328" font-weight="500">1.4 ms <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="333.5" font-size="14" fill="#1f2328" font-weight="400">pdfmake (built-in font)</text><rect x="228" y="320" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="320" width="28.6" height="18" rx="4" fill="#8c959f"/><text x="264.6" y="333.5" font-size="14" fill="#1f2328" font-weight="500">2.7 ms <tspan fill="#656d76" font-weight="400" font-size="12">Latin only</tspan></text><text x="24" y="363.5" font-size="14" fill="#1f2328" font-weight="400">jsPDF (Noto Sans)</text><rect x="228" y="350" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="350" width="159.3" height="18" rx="4" fill="#8c959f"/><text x="395.3" y="363.5" font-size="14" fill="#1f2328" font-weight="500">15 ms <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font</tspan></text><text x="24" y="393.5" font-size="14" fill="#1f2328" font-weight="400">@react-pdf/renderer</text><rect x="228" y="380" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="380" width="194.4" height="18" rx="4" fill="#8c959f"/><text x="430.4" y="393.5" font-size="14" fill="#1f2328" font-weight="500">18 ms <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font</tspan></text><text x="24" y="423.5" font-size="14" fill="#1f2328" font-weight="400">pdfkit (Noto Sans)</text><rect x="228" y="410" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="410" width="220.4" height="18" rx="4" fill="#8c959f"/><text x="456.4" y="423.5" font-size="14" fill="#1f2328" font-weight="500">21 ms <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font</tspan></text><text x="24" y="453.5" font-size="14" fill="#1f2328" font-weight="400">pdfmake (Noto Sans)</text><rect x="228" y="440" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="440" width="237.1" height="18" rx="4" fill="#8c959f"/><text x="473.1" y="453.5" font-size="14" fill="#1f2328" font-weight="500">22 ms <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font</tspan></text><text x="24" y="483.5" font-size="14" fill="#1f2328" font-weight="400">pdf-lib (Noto Sans)</text><rect x="228" y="470" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="470" width="283.4" height="18" rx="4" fill="#8c959f"/><text x="519.4" y="483.5" font-size="14" fill="#1f2328" font-weight="500">27 ms <tspan fill="#656d76" font-weight="400" font-size="12">Unicode font</tspan></text><rect x="24" y="510" width="10" height="10" rx="2" fill="#1a7f37"/><text x="40" y="519" font-size="12" fill="#656d76">fastest</text><rect x="104.19999999999999" y="510" width="10" height="10" rx="2" fill="#818cf8"/><text x="120.19999999999999" y="519" font-size="12" fill="#656d76">pdf-engine</text><rect x="204.2" y="510" width="10" height="10" rx="2" fill="#8c959f"/><text x="220.2" y="519" font-size="12" fill="#656d76">other libraries</text><text x="24" y="542" font-size="11" fill="#656d76">Apple M4, darwin arm64, measured 2026-10-25. Reproduce: bench/README.md</text></svg>
