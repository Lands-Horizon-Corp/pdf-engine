name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust engine and the HTTP and IPC modes.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --no-fail-fast

  # The same checks inside the dev image, which has the production font set: this is what proves
  # every script renders on Linux (tests/languages.rs only runs where those fonts are installed).
  linux-fonts:
    name: Linux with the production fonts (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test

  # Windows: the engine, IPC mode (it takes over the real stdout handle), the Node client, the browser
  # package under Node, and printing to a virtual receipt printer through the real Windows spooler.
  windows:
    name: Windows
    runs-on: windows-latest
    continue-on-error: true   # until this job has been green once; then remove this line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .node/wasm/rust -> target
      - run: cargo build
      - run: cargo test --no-fail-fast
      - run: node --test
        working-directory: .node/desktop
      - name: Printing to a virtual receipt printer
        run: powershell -ExecutionPolicy Bypass -File .public\scripts\windows-printer-test.ps1
      - name: Browser package under Node (needs the wasm build)
        run: |
          $v = (Select-String -Path .node/wasm/rust/Cargo.lock -Pattern 'name = "wasm-bindgen"' -Context 0,1).Context.PostContext[0] -replace '.*"(.+)".*','$1'
          cargo install wasm-bindgen-cli --version $v --locked
          cd .node/wasm
          npm run build
          npm test

  node-client:
    name: Node client (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: node --test
        working-directory: .node/desktop

  # The browser package, in every engine Playwright ships: Chromium (Chrome, Edge, Brave),
  # Firefox, and WebKit (Safari), from plain JavaScript, React and Vue apps.
  browsers:
    name: "Browsers (${{ matrix.os }}: ${{ matrix.browsers }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browsers: "chromium firefox webkit", projects: "--project=chromium --project=firefox --project=webkit" }
          - { os: macos-latest, browsers: "chromium webkit", projects: "--project=chromium --project=webkit" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .node/wasm/rust -> target
      - name: wasm-bindgen CLI (the version the crate locks)
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"$' .node/wasm/rust/Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: cargo build                      # the native server, for the "render on a server" check
      - run: npm run build && npm test
        working-directory: .node/wasm
      - run: npm install
        working-directory: .node/wasm/e2e
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
        working-directory: .node/wasm/e2e
      - run: npx playwright test ${{ matrix.projects }}
        working-directory: .node/wasm/e2e
      - run: npm run test:cdn                  # plain HTML page, no build step
        working-directory: .node/wasm/e2e
