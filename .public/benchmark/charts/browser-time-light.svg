<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">In the browser: time to make one invoice PDF</title><desc id="d">Shorter is faster. 30-row invoice, median after warm-up. Built-in font = Latin only, no Unicode.</desc><rect x="0.5" y="0.5" width="879" height="375" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">In the browser: time to make one invoice PDF</text><text x="24" y="56" font-size="13" fill="#656d76">Shorter is faster. 30-row invoice, median after warm-up. Built-in font = Latin only, no Unicode.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">CHROME, EDGE, BRAVE (CHROMIUM)</text><text x="24" y="115.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="102" width="5.5" height="18" rx="4" fill="#1a7f37"/><text x="241.5" y="115.5" font-size="14" fill="#1f2328" font-weight="700">1.5 ms <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#1f2328" font-weight="400">jspdf-html2canvas</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="132" width="309.6" height="18" rx="4" fill="#8c959f"/><text x="545.6" y="145.5" font-size="14" fill="#1f2328" font-weight="500">85 ms</text><text x="24" y="175.5" font-size="14" fill="#1f2328" font-weight="400">html2pdf.js</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="162" width="360.0" height="18" rx="4" fill="#8c959f"/><text x="596.0" y="175.5" font-size="14" fill="#1f2328" font-weight="500">99 ms</text><text x="24" y="206" font-size="12" font-weight="600" fill="#656d76" letter-spacing="0.4">SAFARI (WEBKIT)</text><text x="24" y="243.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine</text><rect x="228" y="230" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="230" width="7.3" height="18" rx="4" fill="#1a7f37"/><text x="243.3" y="243.5" font-size="14" fill="#1f2328" font-weight="700">2.0 ms <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="273.5" font-size="14" fill="#1f2328" font-weight="400">jspdf-html2canvas</text><rect x="228" y="260" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="260" width="299.7" height="18" rx="4" fill="#8c959f"/><text x="535.7" y="273.5" font-size="14" fill="#1f2328" font-weight="500">82 ms</text><text x="24" y="303.5" font-size="14" fill="#1f2328" font-weight="400">html2pdf.js</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="290" width="358.2" height="18" rx="4" fill="#8c959f"/><text x="594.2" y="303.5" font-size="14" fill="#1f2328" font-weight="500">98 ms</text><rect x="24" y="330" width="10" height="10" rx="2" fill="#1a7f37"/><text x="40" y="339" font-size="12" fill="#656d76">fastest</text><rect x="104.19999999999999" y="330" width="10" height="10" rx="2" fill="#8c959f"/><text x="120.19999999999999" y="339" font-size="12" fill="#656d76">other libraries</text><text x="24" y="362" font-size="11" fill="#656d76">Apple M4, darwin arm64, measured 2026-10-25. Reproduce: .public/benchmark/README.md</text></svg>
