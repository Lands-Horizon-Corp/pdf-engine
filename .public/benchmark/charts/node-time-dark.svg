<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">In Node: time to make one invoice PDF</title><desc id="d">Shorter is faster. 30-row invoice, warm median.</desc><rect x="0.5" y="0.5" width="879" height="285" rx="10" fill="#0d1117" stroke="#30363d"/><text x="24" y="36" font-size="18" font-weight="700" fill="#e6edf3">In Node: time to make one invoice PDF</text><text x="24" y="56" font-size="13" fill="#8b949e">Shorter is faster. 30-row invoice, warm median.</text><text x="24" y="93.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine</text><rect x="228" y="80" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="80" width="3.0" height="18" rx="4" fill="#3fb950"/><text x="239.0" y="93.5" font-size="14" fill="#e6edf3" font-weight="700">3.2 ms <tspan fill="#3fb950" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="123.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="110" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="110" width="5.4" height="18" rx="4" fill="#6e7681"/><text x="241.4" y="123.5" font-size="14" fill="#e6edf3" font-weight="500">12 ms</text><text x="24" y="153.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (default)</text><rect x="228" y="140" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="140" width="32.7" height="18" rx="4" fill="#6e7681"/><text x="268.7" y="153.5" font-size="14" fill="#e6edf3" font-weight="500">71 ms</text><text x="24" y="183.5" font-size="14" fill="#e6edf3" font-weight="400">wkhtmltopdf</text><rect x="228" y="170" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="170" width="208.9" height="18" rx="4" fill="#6e7681"/><text x="444.9" y="183.5" font-size="14" fill="#e6edf3" font-weight="500">455 ms <tspan fill="#8b949e" font-weight="400" font-size="12">archived</tspan></text><text x="24" y="213.5" font-size="14" fill="#e6edf3" font-weight="400">html-pdf</text><rect x="228" y="200" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="200" width="360.0" height="18" rx="4" fill="#6e7681"/><text x="596.0" y="213.5" font-size="14" fill="#e6edf3" font-weight="500">784 ms <tspan fill="#8b949e" font-weight="400" font-size="12">PhantomJS, deprecated</tspan></text><rect x="24" y="240" width="10" height="10" rx="2" fill="#3fb950"/><text x="40" y="249" font-size="12" fill="#8b949e">fastest</text><rect x="104.19999999999999" y="240" width="10" height="10" rx="2" fill="#6e7681"/><text x="120.19999999999999" y="249" font-size="12" fill="#8b949e">other libraries</text><text x="24" y="272" font-size="11" fill="#8b949e">Apple M4, darwin arm64, measured 2026-10-26. Reproduce: .public/benchmark/README.md</text></svg>
