<svg xmlns="http://www.w3.org/2000/svg" width="880" height="496" viewBox="0 0 880 496" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">10,000 large invoices (300 lines, 7-9 pages): time to finish</title><desc id="d">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</desc><rect x="0.5" y="0.5" width="879" height="495" rx="10" fill="#0d1117" stroke="#30363d"/><text x="24" y="36" font-size="18" font-weight="700" fill="#e6edf3">10,000 large invoices (300 lines, 7-9 pages): time to finish</text><text x="24" y="56" font-size="13" fill="#8b949e">Shorter is faster. Every document is different. "Projected" = did not finish in the time budget.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF (NATIVE / SERVER)</text><text x="24" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="102" width="3.0" height="18" rx="4" fill="#3fb950"/><text x="239.0" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">1.0 min <tspan fill="#3fb950" font-weight="700" font-size="12">✓ fastest</tspan></text><text x="24" y="145.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="132" width="7.8" height="18" rx="4" fill="#6e7681"/><text x="243.8" y="145.5" font-size="14" fill="#e6edf3" font-weight="500">3.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 7,079</tspan></text><text x="24" y="175.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (default)</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="162" width="12.2" height="18" rx="4" fill="#6e7681"/><text x="248.2" y="175.5" font-size="14" fill="#e6edf3" font-weight="500">5.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 4,534</tspan></text><text x="24" y="205.5" font-size="14" fill="#e6edf3" font-weight="400">wkhtmltopdf</text><rect x="228" y="192" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="192" width="35.0" height="18" rx="4" fill="#6e7681"/><text x="271.0" y="205.5" font-size="14" fill="#e6edf3" font-weight="500">15.8 min <tspan fill="#8b949e" font-weight="400" font-size="12">x86 under Rosetta, projected from 1,584</tspan></text><text x="24" y="235.5" font-size="14" fill="#e6edf3" font-weight="400">html-pdf</text><rect x="228" y="222" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="222" width="98.4" height="18" rx="4" fill="#6e7681"/><text x="334.4" y="235.5" font-size="14" fill="#e6edf3" font-weight="500">44.6 min <tspan fill="#8b949e" font-weight="400" font-size="12">PhantomJS, x86 under Rosetta, projected from 564</tspan></text><text x="24" y="266" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF IN THE BROWSER</text><text x="24" y="303.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="290" width="9.4" height="18" rx="4" fill="#7c83f5"/><text x="245.4" y="303.5" font-size="14" fill="#e6edf3" font-weight="700">4.3 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 5,847</tspan></text><text x="24" y="333.5" font-size="14" fill="#e6edf3" font-weight="400">dompdf.js</text><rect x="228" y="320" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="320" width="27.4" height="18" rx="4" fill="#6e7681"/><text x="263.4" y="333.5" font-size="14" fill="#e6edf3" font-weight="500">12.4 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 2,019</tspan></text><text x="24" y="363.5" font-size="14" fill="#e6edf3" font-weight="400">html2pdf.js</text><rect x="228" y="350" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="350" width="166.8" height="18" rx="4" fill="#6e7681"/><text x="402.8" y="363.5" font-size="14" fill="#e6edf3" font-weight="500">1.3 h <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 332</tspan></text><text x="24" y="393.5" font-size="14" fill="#e6edf3" font-weight="400">jspdf-html2canvas</text><rect x="228" y="380" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="380" width="187.8" height="18" rx="4" fill="#6e7681"/><text x="423.8" y="393.5" font-size="14" fill="#e6edf3" font-weight="500">1.4 h <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 295</tspan></text><text x="24" y="423.5" font-size="14" fill="#e6edf3" font-weight="400">ironpress (WebAssembly)</text><rect x="228" y="410" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="410" width="360.0" height="18" rx="4" fill="#6e7681"/><text x="596.0" y="423.5" font-size="14" fill="#e6edf3" font-weight="500">2.7 h <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 154</tspan></text><rect x="24" y="450" width="10" height="10" rx="2" fill="#3fb950"/><text x="40" y="459" font-size="12" fill="#8b949e">fastest</text><rect x="104.19999999999999" y="450" width="10" height="10" rx="2" fill="#7c83f5"/><text x="120.19999999999999" y="459" font-size="12" fill="#8b949e">pdf-engine</text><rect x="204.2" y="450" width="10" height="10" rx="2" fill="#6e7681"/><text x="220.2" y="459" font-size="12" fill="#8b949e">other libraries</text><text x="24" y="482" font-size="11" fill="#8b949e">Apple M4, darwin arm64, measured 2026-10-26. Reproduce: .public/benchmark/README.md</text></svg>
