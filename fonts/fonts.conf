<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font set for pdf-engine. Fulgur rebuilds its font collection on every render, so a small,
  curated set keeps renders fast (~10 ms per invoice vs ~45 ms with every installed font).
  `fonts/install.sh` links the fonts into the directory below; point FONTCONFIG_FILE here.
  Add fonts by dropping them into that directory and re-running `fc-cache -f`.
-->
<fontconfig>
  <dir>/usr/share/fonts/pdf-engine</dir>
  <cachedir>/var/cache/pdf-engine-fontconfig</cachedir>
  <!-- Standard aliases: sans-serif -> Noto Sans, serif -> Noto Serif, monospace -> Noto Sans Mono. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
