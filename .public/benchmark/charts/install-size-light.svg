<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Install size</title><desc id="d">Smaller is lighter.</desc><rect x="0.5" y="0.5" width="879" height="315" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">Install size</text><text x="24" y="56" font-size="13" fill="#656d76">Smaller is lighter.</text><text x="24" y="93.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine (in the browser)</text><rect x="228" y="80" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="80" width="3.1" height="18" rx="4" fill="#1a7f37"/><text x="239.1" y="93.5" font-size="14" fill="#1f2328" font-weight="700">3.2 MB <tspan fill="#1a7f37" font-weight="700" font-size="12">✓ smallest</tspan> <tspan fill="#656d76" font-weight="400" font-size="12">compressed</tspan></text><text x="24" y="123.5" font-size="14" fill="#1f2328" font-weight="700">pdf-engine (native binary)</text><rect x="228" y="110" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="110" width="28.0" height="18" rx="4" fill="#818cf8"/><text x="264.0" y="123.5" font-size="14" fill="#1f2328" font-weight="700">29 MB</text><text x="24" y="153.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer + headless shell</text><rect x="228" y="140" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="140" width="199.7" height="18" rx="4" fill="#8c959f"/><text x="435.7" y="153.5" font-size="14" fill="#1f2328" font-weight="500">203 MB</text><text x="24" y="183.5" font-size="14" fill="#1f2328" font-weight="400">Puppeteer + Chrome</text><rect x="228" y="170" width="360" height="18" rx="4" fill="#f3f4f6"/><rect x="228" y="170" width="360.0" height="18" rx="4" fill="#8c959f"/><text x="596.0" y="183.5" font-size="14" fill="#1f2328" font-weight="500">367 MB</text><text x="