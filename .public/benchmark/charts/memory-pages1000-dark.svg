<svg xmlns="http://www.w3.org/2000/svg" width="880" height="496" viewBox="0 0 880 496" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">One PDF of 1000 pages: peak memory</title><desc id="d">Shorter is better. Peak resident memory of the process and everything it starts, in a fresh process.</desc><rect x="0.5" y="0.5" width="879" height="495" rx="10" fill="#0d1117" stroke="#30363d"/><text x="24" y="36" font-size="18" font-weight="700" fill="#e6edf3">One PDF of 1000 pages: peak memory</text><text x="24" y="56" font-size="13" fill="#8b949e">Shorter is better. Peak resident memory of the process and everything it starts, in a fresh process.</text><text x="24" y="78" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF (NATIVE / SERVER)</text><text x="24" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">wkhtmltopdf</text><rect x="228" y="102" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="102" width="31.2" height="18" rx="4" fill="#3fb950"/><text x="267.2" y="115.5" font-size="14" fill="#e6edf3" font-weight="700">283 MB <tspan fill="#3fb950" font-weight="700" font-size="12">✓ least memory</tspan></text><text x="24" y="145.5" font-size="14" fill="#e6edf3" font-weight="400">html-pdf (PhantomJS)</text><rect x="228" y="132" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="132" width="35.9" height="18" rx="4" fill="#6e7681"/><text x="271.9" y="145.5" font-size="14" fill="#e6edf3" font-weight="500">326 MB</text><text x="24" y="175.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine</text><rect x="228" y="162" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="162" width="144.6" height="18" rx="4" fill="#7c83f5"/><text x="380.6" y="175.5" font-size="14" fill="#e6edf3" font-weight="700">1311 MB</text><text x="24" y="205.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (headless shell)</text><rect x="228" y="192" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="192" width="262.4" height="18" rx="4" fill="#6e7681"/><text x="498.4" y="205.5" font-size="14" fill="#e6edf3" font-weight="500">2379 MB</text><text x="24" y="235.5" font-size="14" fill="#e6edf3" font-weight="400">Puppeteer (default)</text><rect x="228" y="222" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="222" width="360.0" height="18" rx="4" fill="#6e7681"/><text x="596.0" y="235.5" font-size="14" fill="#e6edf3" font-weight="500">3264 MB</text><text x="24" y="266" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF IN THE BROWSER (THE WHOLE BROWSER COUNTS)</text><text x="24" y="303.5" font-size="14" fill="#e6edf3" font-weight="400">ironpress</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="290" width="95.5" height="18" rx="4" fill="#6e7681"/><text x="331.5" y="303.5" font-size="14" fill="#e6edf3" font-weight="500">866 MB</text><text x="24" y="333.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="320" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="320" width="187.6" height="18" rx="4" fill="#7c83f5"/><text x="423.6" y="333.5" font-size="14" fill="#e6edf3" font-weight="700">1701 MB</text><text x="24" y="363.5" font-size="14" fill="#e6edf3" font-weight="400">dompdf.js</text><rect x="228" y="350" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="350" width="210.5" height="18" rx="4" fill="#6e7681"/><text x="446.5" y="363.5" font-size="14" fill="#e6edf3" font-weight="500">1909 MB</text><text x="24" y="393.5" font-size="14" fill="#e6edf3" font-weight="400">html2pdf.js</text><rect x="228" y="380" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="380" width="313.2" height="18" rx="4" fill="#6e7681"/><text x="549.2" y="393.5" font-size="14" fill="#e6edf3" font-weight="500">2840 MB</text><text x="24" y="423.5" font-size="14" fill="#e6edf3" font-weight="400">jspdf-html2canvas</text><rect x="228" y="410" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="410" width="3.0" height="18" rx="4" fill="#6e7681"/><text x="239.0" y="423.5" font-size="14" fill="#e6edf3" font-weight="500">failed <tspan fill="#8b949e" font-weight="400" font-size="12">addImage does not support files of type </tspan></text><rect x="24" y="450" width="10" height="10" rx="2" fill="#3fb950"/><text x="40" y="459" font-size="12" fill="#8b949e">least memory</text><rect x="137.2" y="450" width="10" height="10" rx="2" fill="#7c83f5"/><text x="153.2" y="459" font-size="12" fill="#8b949e">pdf-engine</text><rect x="237.2" y="450" width="10" height="10" rx="2" fill="#6e7681"/><text x="253.2" y="459" font-size="12" fill="#8b949e">other libraries</text><text x="24" y="482" font-size="11" fill="#8b949e">Apple M4, darwin arm64, measured 2026-10-26. Reproduce: .public/benchmark/README.md</text></svg>
