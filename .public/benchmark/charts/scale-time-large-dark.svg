cted from 8,422</tspan></text><text x="24" y="205.5" font-size="14" fill="#e6edf3" font-weight="400">wkhtmltopdf</text><rect x="228" y="192" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="192" width="23.0" height="18" rx="4" fill="#6e7681"/><text x="259.0" y="205.5" font-size="14" fill="#e6edf3" font-weight="500">10.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">x86 under Rosetta, projected from 2,384</tspan></text><text x="24" y="235.5" font-size="14" fill="#e6edf3" font-weight="400">html-pdf</text><rect x="228" y="222" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="222" width="49.2" height="18" rx="4" fill="#6e7681"/><text x="285.2" y="235.5" font-size="14" fill="#e6edf3" font-weight="500">22.4 min <tspan fill="#8b949e" font-weight="400" font-size="12">PhantomJS, x86 under Rosetta, projected from 1,117</tspan></text><text x="24" y="266" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.4">HTML TO PDF IN THE BROWSER</text><text x="24" y="303.5" font-size="14" fill="#e6edf3" font-weight="700">pdf-engine (WebAssembly)</text><rect x="228" y="290" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="290" width="4.8" height="18" rx="4" fill="#7c83f5"/><text x="240.8" y="303.5" font-size="14" fill="#e6edf3" font-weight="700">2.2 min</text><text x="24" y="333.5" font-size="14" fill="#e6edf3" font-weight="400">dompdf.js</text><rect x="228" y="320" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="320" width="27.5" height="18" rx="4" fill="#6e7681"/><text x="263.5" y="333.5" font-size="14" fill="#e6edf3" font-weight="500">12.5 min <tspan fill="#8b949e" font-weight="400" font-size="12">projected from 1,993</tspan></text><text x="24" y="363.5" font-size="14" fill="#e6edf3" font-weight="400">html2pdf.js</text><rect x="228" y="350" width="360" height="18" rx="4" fill="#161b22"/><rect x="228" y="350" width="97.0" height="18" rx="4" fill="#6e7681"/><text x="333.0" y="363.5" font-size="14" fil